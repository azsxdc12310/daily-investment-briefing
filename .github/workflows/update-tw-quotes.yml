name: Update Taiwan closing quotes

on:
  schedule:
    # 17:15 Taipei time on weekdays, after the exchanges publish closing data.
    - cron: "15 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-taiwan-closing-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official Taiwan closing quotes
        run: python scripts/update_tw_quotes.py
      - name: Publish quote data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tw-quotes.json
          if git diff --cached --quiet; then
            echo "No quote data changes."
          else
            git commit -m "Update official Taiwan closing quotes"
            git push
          fi
